<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOD SKIN FF IOS</title>
<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#000,#2b0000);
  color:white;
}
header{
  text-align:center;
  padding:20px;
  background:linear-gradient(to right,#400,#900);
  font-size:30px;
  font-weight:bold;
  text-shadow:0 0 10px red;
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:20px;
  padding:20px;
}
.card{
  background:#1a0000;
  border-radius:15px;
  padding:15px;
  text-align:center;
  box-shadow:0 0 15px rgba(255,0,0,0.3);
}
.card img{
  width:100%;
  height:250px;
  object-fit:cover;
  border-radius:10px;
}
.btn{
  display:inline-block;
  margin-top:10px;
  padding:10px 20px;
  background:red;
  color:white;
  text-decoration:none;
  border-radius:8px;
  font-weight:bold;
}
</style>
</head>
<body>
<header>MOD SKIN FF</header>
<div class="grid" id="grid"></div>
<script>
let skins = JSON.parse(localStorage.getItem("skins")) || [];
const grid=document.getElementById("grid");
if(skins.length===0){
  grid.innerHTML="<h2 style='text-align:center;'>Chưa có skin nào</h2>";
}else{
  skins.forEach(skin=>{
    grid.innerHTML += `
      <div class="card">
        <img src="${skin.image}">
        <h3>${skin.name}</h3>
        <a class="btn" href="${skin.download}" target="_blank">TẢI NGAY</a>
      </div>`;
  });
}
</script>
</body>
</html>
